<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Core 3D - Three.js</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #08090c;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    .ui-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      color: #00f3ff;
      font-family: 'Courier New', Courier, monospace;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
    }
    .ui-overlay h1 {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .ui-overlay p {
      margin: 0;
      font-size: 0.75rem;
      color: #8a99ad;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="ui-overlay">
    <h1>[ QUANTUM_CORE // v1.0 ]</h1>
    <p>ARRASTE PARA ROTACIONAR • SCROLL PARA ZOOM</p>
  </div>
  <div id="canvas-container"></div>

  <!-- Three.js + OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const container = document.getElementById('canvas-container');

    // 1. CENA E CÂMERA
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x08090c, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 36);

    // 2. RENDERER
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    container.appendChild(renderer.domElement);

    // 3. CONTROLES DE ÓRBITA
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 70;
    controls.minDistance = 12;

    // 4. ILUMINAÇÃO DINÂMICA (Neon & Ambient)
    const ambientLight = new THREE.AmbientLight(0x0a0d14, 2.0);
    scene.add(ambientLight);

    const lightCyan = new THREE.PointLight(0x00f3ff, 4, 60);
    const lightMagenta = new THREE.PointLight(0xff0055, 4, 60);
    const lightViolet = new THREE.PointLight(0x7000ff, 3, 60);

    scene.add(lightCyan, lightMagenta, lightViolet);

    // 5. GEOMETRIA PRINCIPAL (Torus Knot Escultórico)
    const geometry = new THREE.TorusKnotGeometry(7, 2.2, 180, 32);

    // Core sólido metálico refletivo
    const coreMaterial = new THREE.MeshStandardMaterial({
      color: 0x0f1117,
      roughness: 0.12,
      metalness: 0.95,
      wireframe: false
    });

    const coreMesh = new THREE.Mesh(geometry, coreMaterial);
    scene.add(coreMesh);

    // Camada exterior wireframe pulsante
    const wireMaterial = new THREE.MeshBasicMaterial({
      color: 0x00f3ff,
      wireframe: true,
      transparent: true,
      opacity: 0.18
    });

    const wireMesh = new THREE.Mesh(geometry, wireMaterial);
    wireMesh.scale.set(1.035, 1.035, 1.035);
    scene.add(wireMesh);

    // 6. CAMPO DE PARTÍCULAS ORBITAL
    const particlesCount = 3000;
    const positions = new Float32Array(particlesCount * 3);
    const colors = new Float32Array(particlesCount * 3);

    const c1 = new THREE.Color(0x00f3ff);
    const c2 = new THREE.Color(0xff0055);

    for (let i = 0; i < particlesCount * 3; i += 3) {
      const radius = 14 + Math.random() * 22;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);

      positions[i] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
      positions[i + 2] = radius * Math.cos(phi);

      const mixedColor = c1.clone().lerp(c2, Math.random());
      colors[i] = mixedColor.r;
      colors[i + 1] = mixedColor.g;
      colors[i + 2] = mixedColor.b;
    }

    const particlesGeometry = new THREE.BufferGeometry();
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particleSystem);

    // 7. LOOP DE ANIMAÇÃO
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      // Rotações combinadas do objeto central
      coreMesh.rotation.x = t * 0.15;
      coreMesh.rotation.y = t * 0.25;

      wireMesh.rotation.x = t * 0.15;
      wireMesh.rotation.y = t * 0.25;

      // Rotação sutil do campo de poeira
      particleSystem.rotation.y = t * 0.04;
      particleSystem.rotation.x = t * 0.02;

      // Órbitas tridimensionais das luzes coloridas
      lightCyan.position.x = Math.sin(t * 0.6) * 22;
      lightCyan.position.y = Math.cos(t * 0.4) * 22;
      lightCyan.position.z = Math.cos(t * 0.5) * 22;

      lightMagenta.position.x = Math.cos(t * 0.4) * 24;
      lightMagenta.position.y = Math.sin(t * 0.7) * 24;
      lightMagenta.position.z = Math.sin(t * 0.3) * 24;

      lightViolet.position.x = Math.sin(t * 0.3) * 20;
      lightViolet.position.y = Math.cos(t * 0.8) * 20;
      lightViolet.position.z = Math.sin(t * 0.6) * 20;

      controls.update();
      renderer.render(scene, camera);
    }

    // 8. REDIMENSIONAMENTO RESPONSIVO
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
