<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor 3D | Inspeção CAD Avançada</title>
    <style>
        :root {
            --midnight-carbon: #0F1115;
            --neon-cyan: #00E5FF;
            --glass-bg: rgba(15, 17, 21, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #E2E8F0;
            --text-muted: #64748B;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--midnight-carbon);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* UI Overlays com estilo Smoked Glass */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .title-box {
            padding: 16px 24px;
            max-width: 400px;
        }

        .title-box h1 {
            margin: 0 0 8px 0;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--neon-cyan);
        }

        .title-box p {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Painel de Inspeção Lateral */
        .inspector-panel {
            position: absolute;
            right: 24px;
            top: 24px;
            width: 280px;
            padding: 20px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .inspector-panel.active {
            transform: translateX(0);
        }

        .inspector-panel h2 {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 0;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 8px;
        }

        .part-name {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin: 12px 0;
            word-wrap: break-word;
        }

        .specs-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 12px;
        }

        .specs-list li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .specs-list span {
            color: var(--neon-cyan);
            font-family: monospace;
        }

        /* Controles Inferiores */
        .controls-container {
            align-self: center;
            width: 100%;
            max-width: 600px;
            padding: 20px 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .control-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            width: 140px;
        }

        input[type="range"] {
            flex-grow: 1;
            -webkit-appearance: none;
            background: transparent;
            height: 4px;
            border-radius: 2px;
            background: #2A2F3A;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--neon-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover, .btn.active {
            background: var(--neon-cyan);
            color: var(--midnight-carbon);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--midnight-carbon);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(0, 229, 255, 0.2);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        #loading-text {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--neon-cyan);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <div id="loading-text">INICIALIZANDO MOTOR 3D...</div>
    </div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="header">
            <div class="glass-panel title-box">
                <h1>2-Cylinder Engine</h1>
                <p>Modelo Importado (.glb) • Iluminação HDRI PBR • Cinemática e Vista Explodida Calculada em Tempo Real.</p>
            </div>
            
            <div class="glass-panel inspector-panel" id="inspector">
                <h2>Inspeção de Peça</h2>
                <div class="part-name" id="part-name">Nenhuma Selecionada</div>
                <ul class="specs-list">
                    <li>Material: <span id="part-mat">---</span></li>
                    <li>Geometria: <span id="part-vert">---</span></li>
                    <li>Tensão Operacional: <span>12V DC</span></li>
                    <li>Status: <span>OK</span></li>
                </ul>
            </div>
        </div>

        <div class="glass-panel controls-container">
            <div class="control-group">
                <span class="control-label">Vista Explodida</span>
                <input type="range" id="explode-slider" min="0" max="2" step="0.01" value="0">
            </div>
            <div class="control-group" style="justify-content: flex-start; gap: 12px;">
                <button class="btn" id="btn-xray">Modo Raio-X</button>
                <button class="btn" id="btn-spin">Auto-Rotação</button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Bibliotecas Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

    <script>
        // 1. CONFIGURAÇÃO BASE
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0F1115, 0.002);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 300;

        // 2. ILUMINAÇÃO & AMBIENTE HDRI
        // Carregando HDRI para reflexos realistas de metal
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.RGBELoader()
            .setDataType(THREE.UnsignedByteType)
            .load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/equirectangular/royal_esplanade_1k.hdr', function (texture) {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.environment = envMap;
                texture.dispose();
                pmremGenerator.dispose();
            });

        // Luzes direcionais de suporte para contraste
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x00E5FF, 1.5);
        backLight.position.set(-10, -20, -10);
        scene.add(backLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        // 3. IMPORTAÇÃO DO MODELO GLB (Khronos 2-Cylinder Engine)
        const loader = new THREE.GLTFLoader();
        const modelUrl = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/2CylinderEngine/glTF-Binary/2CylinderEngine.glb';
        
        let engineModel, engineParts = [];
        let isXray = false;
        let autoRotate = false;
        const xrayMaterial = new THREE.MeshBasicMaterial({ color: 0x00E5FF, wireframe: true, transparent: true, opacity: 0.15 });
        const highlightMaterial = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x00E5FF, emissiveIntensity: 0.8, roughness: 0.2, metalness: 0.8 });

        const loadingText = document.getElementById('loading-text');

        loader.load(
            modelUrl,
            (gltf) => {
                engineModel = gltf.scene;
                
                // Centralizar e escalar modelo dinamicamente
                const box = new THREE.Box3().setFromObject(engineModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                const targetSize = 50; // Tamanho ideal para visualização
                const scale = targetSize / maxDim;
                engineModel.scale.set(scale, scale, scale);
                
                engineModel.position.sub(center.multiplyScalar(scale)); // Centraliza no mundo
                scene.add(engineModel);

                camera.position.set(targetSize, targetSize * 0.8, targetSize * 1.5);
                controls.target.set(0, 0, 0);

                // Processar peças para Vista Explodida e Salvar Materiais
                engineModel.traverse((child) => {
                    if (child.isMesh) {
                        engineParts.push(child);
                        
                        // Salvar material original para toggle
                        child.userData.originalMaterial = child.material;
                        
                        // Calcular vetor de explosão a partir do centro da peça até o centro do modelo
                        child.geometry.computeBoundingBox();
                        const partCenter = new THREE.Vector3();
                        child.geometry.boundingBox.getCenter(partCenter);
                        partCenter.multiplyScalar(scale); // Aplica a mesma escala
                        
                        // Adiciona a posição do nó pai para pegar o world position aproximado
                        partCenter.add(child.position.clone().multiplyScalar(scale));

                        child.userData.originalPosition = child.position.clone();
                        // O vetor de explosão é a direção do centro (0,0,0) para a peça
                        child.userData.explodeVector = partCenter.clone().normalize().multiplyScalar(targetSize * 0.8);
                    }
                });

                // Ocultar Loader
                const loaderEl = document.getElementById('loader');
                loaderEl.style.opacity = '0';
                setTimeout(() => loaderEl.style.display = 'none', 500);
            },
            (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                loadingText.innerText = `BAIXANDO GEOMETRIA: ${percent || 0}%`;
            },
            (error) => {
                console.error('Erro ao carregar GLB:', error);
                loadingText.innerText = 'ERRO AO CARREGAR MODELO. VERIFIQUE CONEXÃO.';
                loadingText.style.color = '#ff0055';
            }
        );

        // 4. LÓGICA DE INTERAÇÃO (Raycasting & Vista Explodida)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedObject = null;
        const inspectorPanel = document.getElementById('inspector');

        window.addEventListener('click', (event) => {
            // Ignorar cliques na UI
            if(event.target.tagName === 'INPUT' || event.target.tagName === 'BUTTON') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            if (!engineModel) return;

            const intersects = raycaster.intersectObject(engineModel, true);

            if (intersects.length > 0) {
                // Restaurar anterior
                if (selectedObject && !isXray) {
                    selectedObject.material = selectedObject.userData.originalMaterial;
                }

                selectedObject = intersects[0].object;
                
                // Aplicar Highlight
                if (!isXray) {
                    selectedObject.material = highlightMaterial;
                }

                // Atualizar UI
                document.getElementById('part-name').innerText = selectedObject.name || 'Componente Genérico';
                document.getElementById('part-mat').innerText = selectedObject.userData.originalMaterial.name || 'PBR Metal';
                document.getElementById('part-vert').innerText = `${selectedObject.geometry.attributes.position.count} Vertices`;
                
                inspectorPanel.classList.add('active');
            } else {
                // Desmarcar
                if (selectedObject && !isXray) {
                    selectedObject.material = selectedObject.userData.originalMaterial;
                }
                selectedObject = null;
                inspectorPanel.classList.remove('active');
            }
        });

        // Controles de UI
        const explodeSlider = document.getElementById('explode-slider');
        explodeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            engineParts.forEach(part => {
                const start = part.userData.originalPosition;
                const offset = part.userData.explodeVector.clone().multiplyScalar(val);
                part.position.copy(start).add(offset);
            });
        });

        document.getElementById('btn-xray').addEventListener('click', (e) => {
            isXray = !isXray;
            e.target.classList.toggle('active');
            
            engineParts.forEach(part => {
                if (isXray) {
                    part.material = xrayMaterial;
                } else {
                    part.material = part === selectedObject ? highlightMaterial : part.userData.originalMaterial;
                }
            });
        });

        document.getElementById('btn-spin').addEventListener('click', (e) => {
            autoRotate = !autoRotate;
            e.target.classList.toggle('active');
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 2.0;
        });

        // 5. LOOP DE ANIMAÇÃO E RESIZE
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
